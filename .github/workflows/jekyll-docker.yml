name: Deploy Biblioteca de Comics

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Inyectar token en el HTML
        run: |
          sed -i "s#__ALMACEN_KEY__#${{ secrets.ALMACEN_KEY }}#g" index.html

      - name: Preparar carpeta de salida
        run: |
          mkdir -p dist
          cp index.html dist/index.html

      - name: Subir artefacto para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
